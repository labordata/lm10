# Monthly from-scratch rebuild. The nightly incremental update
# (main.yml) can't see paper filings (81% of the dataset), upstream
# deletions, or filings dropped by transient errors; this full crawl
# reconciles the published database with OLMS and refreshes the
# bootstrap asset the incremental path builds on.

name: Full Database Rebuild

concurrency:
  group: database-build

on:
  schedule:
    - cron: '15 10 1 * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: install requirements
        run: |
          pip install -r requirements.txt

      - name: build database
        run: make lm10.db

      - name: setup asset
        run: |
          zip lm10.db.zip lm10.db

      - name: release
        if: github.ref == 'refs/heads/main'
        uses: WebFreak001/deploy-nightly@v3.0.0
        with:
          upload_url: https://uploads.github.com/repos/labordata/lm10/releases/132168957/assets{?name,label}
          release_id: 132168957
          asset_path: ./lm10.db.zip # path to archive to upload
          asset_name: lm10.db.zip # name to upload the release as, use $$ to insert date (YYYYMMDD) and 6 letter commit hash
          asset_content_type: application/zip # required by GitHub API
