# This is a basic workflow to help you get started with Actions

name: Update Database

concurrency: 
  group: database-build


# Controls when the action will run. 
on:
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '15 4 * * *'
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2

      - name: install requirements
        run: |
          pip install -r requirements.txt

      - name: download previous artifacts
        # Pull the prior release zip so we can extend it incrementally.
        # Failure is fine — the next step falls back to a full crawl.
        continue-on-error: true
        run: |
          curl -sL -o prev.zip "https://github.com/labordata/lm10/releases/download/nightly/lm10.db.zip"
          unzip -o prev.zip filing.jl organization.csv lm10.db || true
          rm -f prev.zip

      - name: build database
        run: |
          # Incremental path: append new filings to cached filing.jl /
          # organization.csv, then rerun the existing Makefile. Falls
          # back to a full crawl if no cumulative inputs are present
          # (exit code 2) or anything else goes wrong.
          bash tools/incremental_update.sh || make lm10.db

      - name: setup asset
        run: |
          zip lm10.db.zip lm10.db filing.jl organization.csv filer.csv

      - name: release
        if: github.ref == 'refs/heads/main'
        uses: WebFreak001/deploy-nightly@v3.0.0
        with:
          upload_url: https://uploads.github.com/repos/labordata/lm10/releases/132168957/assets{?name,label}
          release_id: 132168957
          asset_path: ./lm10.db.zip # path to archive to upload
          asset_name: lm10.db.zip # name to upload the release as, use $$ to insert date (YYYYMMDD) and 6 letter commit hash
          asset_content_type: application/zip # required by GitHub API

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1